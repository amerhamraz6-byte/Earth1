    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Vazirmatn", "Tahoma", sans-serif;
        color: #fff;
        overflow-x: hidden;
        background: #000;
      }

      #earthCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -2;
        display: block;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.7) 0%,
          rgba(0, 20, 40, 0.8) 100%
        );
        z-index: -1;
        pointer-events: none;
      }

      .back-btn {
        position: fixed;
        top: 30px;
        right: 30px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 191, 255, 0.3);
        color: #fff;
        padding: 12px 28px;
        border-radius: 50px;
        cursor: pointer;
        transition: 0.4s;
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      .back-btn:hover {
        border-color: #00bfff;
        background: rgba(0, 191, 255, 0.2);
        transform: translateX(-5px);
        box-shadow: 0 0 25px rgba(0, 191, 255, 0.3);
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 100px 2rem 4rem;
        position: relative;
        z-index: 2;
      }

      .page-header {
        text-align: center;
        margin-bottom: 4rem;
        padding: 2rem;
        border-bottom: 1px solid rgba(0, 191, 255, 0.2);
      }

      .page-title {
        font-size: clamp(2.5rem, 6vw, 5rem);
        font-weight: 200;
        margin-bottom: 1rem;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        background: linear-gradient(135deg, #fff, #00bfff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 2px;
      }

      .page-subtitle {
        font-size: 1.3rem;
        max-width: 800px;
        margin: 0 auto;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        font-weight: 300;
      }

      .filter-bar {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin: 3rem 0;
      }

      .filter-btn {
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(0, 191, 255, 0.2);
        color: #fff;
        padding: 12px 28px;
        border-radius: 40px;
        cursor: pointer;
        transition: 0.3s;
        font-size: 0.95rem;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: rgba(0, 191, 255, 0.2);
        border-color: #00bfff;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }

      .gallery-section {
        margin-bottom: 6rem;
      }

      .section-title {
        font-size: 2.2rem;
        font-weight: 300;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        gap: 15px;
        color: #00bfff;
        border-right: 4px solid #00bfff;
        padding-right: 20px;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }

      .gallery-item {
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        border-radius: 15px;
        overflow: hidden;
        transition: 0.4s;
        border: 1px solid rgba(0, 191, 255, 0.1);
        cursor: pointer;
        position: relative;
      }

      .gallery-item:hover {
        transform: translateY(-8px);
        border-color: #00bfff;
        box-shadow: 0 15px 30px rgba(0, 191, 255, 0.2);
      }

      .gallery-img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        transition: 0.5s;
      }

      .gallery-item:hover .gallery-img {
        transform: scale(1.05);
      }

      .gallery-caption {
        padding: 15px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
      }

      .gallery-title {
        font-size: 1.1rem;
        margin-bottom: 5px;
        color: #00bfff;
      }

      .gallery-desc {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.8);
        line-height: 1.5;
      }

      .location-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 191, 255, 0.3);
        backdrop-filter: blur(5px);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        z-index: 1000;
        display: none;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(10px);
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        max-width: 90vw;
        max-height: 90vh;
        position: relative;
      }

      .modal-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 10px;
      }

      .modal-close {
        position: absolute;
        top: -40px;
        left: -40px;
        background: none;
        border: none;
        color: #fff;
        font-size: 2.5rem;
        cursor: pointer;
        transition: 0.3s;
      }

      .modal-close:hover {
        color: #00bfff;
        transform: scale(1.1);
      }

      .modal-caption {
        position: absolute;
        bottom: -60px;
        right: 0;
        left: 0;
        text-align: center;
        color: #fff;
        font-size: 1.2rem;
        padding: 20px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      }

      .footer {
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(12px);
        padding: 3rem 2rem;
        text-align: center;
        border-top: 1px solid rgba(0, 191, 255, 0.2);
        position: relative;
        z-index: 2;
        margin-top: 4rem;
      }

      .footer-logo {
        font-size: 2rem;
        font-weight: 200;
        margin-bottom: 1rem;
        letter-spacing: 4px;
      }

      .footer-logo span {
        color: #00bfff;
      }

      .footer-text {
        color: rgba(255, 255, 255, 0.7);
        max-width: 600px;
        margin: 0 auto;
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .back-btn {
          top: 20px;
          right: 20px;
          padding: 10px 18px;
        }
        .gallery-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

    <main class="container">

      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterGallery('all')">
          همه
        </button>
        <button class="filter-btn" onclick="filterGallery('natural')">
          زیبایی‌های طبیعی

        <button class="filter-btn" onclick="filterGallery('geology')">

        <button class="filter-btn" onclick="filterGallery('satellite')">
          زمین از بالا
        </button>
        <button class="filter-btn" onclick="filterGallery('weather')">
          پدیده‌های جوی
        </button>
      </div>

        <div class="gallery-grid" id="natural-gallery"></div>

      <!-- شگفتی‌های زمین‌شناسی (۱۵ عکس) -->

          <i class="fa-solid fa-mountain"></i> شگفتی‌های زمین‌شناسی

        <div class="gallery-grid" id="geology-gallery"></div>
      </section>

      <!-- زمین از بالا (۱۵ عکس) -->
      <section class="gallery-section" data-category="satellite">
        <h2 class="section-title">
          <i class="fa-solid fa-satellite"></i> زمین از بالا
        </h2>
        <div class="gallery-grid" id="satellite-gallery"></div>
      </section>

      <!-- پدیده‌های جوی (۱۵ عکس) -->
      <section class="gallery-section" data-category="weather">
        <h2 class="section-title">
          <i class="fa-solid fa-cloud-sun"></i> پدیده‌های جوی
        </h2>
        <div class="gallery-grid" id="weather-gallery"></div>
      </section>
    </main>

        <img class="modal-img" id="modal-img" src="" alt="" />
        <div class="modal-caption" id="modal-caption"></div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
    </div>

      // ===== رندر گالری =====
      function renderGalleries() {
        for (let category in images) {
          const container = document.getElementById(`${category}-gallery`);
          if (!container) continue;

          container.innerHTML = images[category]
            .map(
              (img) => `
          <div class="gallery-item" onclick="openModal('${img.src}', '${img.title} - ${img.desc} (${img.location})')">
            <img class="gallery-img" src="${img.src}" alt="${img.title}" loading="lazy">
            <div class="location-badge">${img.location}</div>
            <div class="gallery-caption">
              <h3 class="gallery-title">${img.title}</h3>
              <p class="gallery-desc">${img.desc}</p>
            </div>
          </div>
        `,
            )
            .join("");
        }
      }

      // ===== فیلتر =====
      function filterGallery(category) {
        document
          .querySelectorAll(".filter-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");

        document.querySelectorAll(".gallery-section").forEach((section) => {
          section.style.display =
            category === "all" || section.dataset.category === category
              ? "block"
              : "none";
        });
      }

      // ===== مودال =====
      function openModal(src, caption) {
        const modal = document.getElementById("modal");
        document.getElementById("modal-img").src = src;
        document.getElementById("modal-caption").textContent = caption;
        modal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
        document.body.style.overflow = "auto";
      }

      document.getElementById("modal").addEventListener("click", function (e) {
        if (e.target === this) closeModal();
      });

      // ===== کد Three.js زمین =====
      (function () {
        const canvas = document.getElementById("earthCanvas");
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          45,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: true,
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 3, 5);
        scene.add(directionalLight);

        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // ستاره‌ها
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i++)
          starsPositions[i] = (Math.random() - 0.5) * 1000;
        starsGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(starsPositions, 3),
        );
        const starsMaterial = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.7,
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        const textureLoader = new THREE.TextureLoader();

        // بافت روز زمین (آبی)
        const earthTexture = textureLoader.load(
          "https://threejs.org/examples/textures/planets/earth_day_2048.jpg",
        );
        const earthBumpMap = textureLoader.load(
          "https://threejs.org/examples/textures/planets/earth_normal_2048.jpg",
        );
        const earthSpecularMap = textureLoader.load(
          "https://threejs.org/examples/textures/planets/earth_specular_2048.jpg",
        );
        const cloudsTexture = textureLoader.load(
          "https://threejs.org/examples/textures/planets/earth_clouds_1024.png",
        );

        const earthGeometry = new THREE.SphereGeometry(2, 64, 64);
        const earthMaterial = new THREE.MeshPhongMaterial({
          map: earthTexture,
          bumpMap: earthBumpMap,
          bumpScale: 0.05,
          specularMap: earthSpecularMap,
          specular: new THREE.Color(0x333333),
          shininess: 5,
        });
        const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
        earthGroup.add(earthMesh);

        const cloudsGeometry = new THREE.SphereGeometry(2.05, 64, 64);
        const cloudsMaterial = new THREE.MeshPhongMaterial({
          map: cloudsTexture,
          transparent: true,
          opacity: 0.7,
          depthWrite: false,
        });
        const cloudsMesh = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
        earthGroup.add(cloudsMesh);

        let mouseDown = false;
        let lastMouseX = 0,
          lastMouseY = 0;
        let targetRotationX = 0,
          targetRotationY = 0;
        let currentRotationX = 0,
          currentRotationY = 0;
        let isRotating = true;
        let rotationSpeed = 0.5;

        canvas.addEventListener("mousedown", (e) => {
          mouseDown = true;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        });

        canvas.addEventListener("mousemove", (e) => {
          if (!mouseDown) return;
          const deltaX = e.clientX - lastMouseX;
          const deltaY = e.clientY - lastMouseY;
          targetRotationY += deltaX * 0.005;
          targetRotationX += deltaY * 0.005;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        });

        canvas.addEventListener("mouseup", () => {
          mouseDown = false;
        });
        canvas.addEventListener("mouseleave", () => {
          mouseDown = false;
        });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
          requestAnimationFrame(animate);

          currentRotationX += (targetRotationX - currentRotationX) * 0.05;
          currentRotationY += (targetRotationY - currentRotationY) * 0.05;

          if (mouseDown) {
            earthGroup.rotation.x = currentRotationX;
            earthGroup.rotation.y = currentRotationY;
          } else if (isRotating) {
            earthGroup.rotation.y += 0.001 * rotationSpeed;
          }

          cloudsMesh.rotation.y += 0.001 * rotationSpeed * 1.2;
          renderer.render(scene, camera);
        }

        animate();
      })();

      window.onload = renderGalleries;
    </script>
  </body>
